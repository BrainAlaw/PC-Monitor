<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Monitor layout measurement</title>
<link rel="stylesheet" href="/__measure-delay.css">
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;overflow:hidden}iframe{display:block}</style>
</head>
<body>
<iframe id="dashboard" title="Dashboard under measurement"></iframe>
<pre id="layout-report" hidden></pre>
<script>
const params = new URLSearchParams(location.search);
const width = Number(params.get('width'));
const height = Number(params.get('height'));
const frame = document.getElementById('dashboard');
frame.style.width = width + 'px';
frame.style.height = height + 'px';
frame.src = '/';

const selectors = [
  '.content',
  '.layout',
  '.signal-grid',
  '.device-grid',
  '.core-grid',
  '.cooling-grid',
  '.drive-grid',
  '.members',
  '.rate-pair'
];
const reportElement = document.getElementById('layout-report');

function measure() {
  const doc = frame.contentDocument;
  if (!doc || doc.readyState !== 'complete') return;
  doc.documentElement.classList.remove('embedded');
  const win = frame.contentWindow;
  const containers = [];
  for (const selector of selectors) {
    for (const container of doc.querySelectorAll(selector)) {
      if (win.getComputedStyle(container).display === 'contents') continue;
      const sourceChildren = selector === '.content' ? [...container.querySelectorAll('.panel')] : [...container.children];
      const children = sourceChildren.filter(child => {
        const rect = child.getBoundingClientRect();
        return rect.width > 0 && rect.height > 0;
      });
      if (!children.length) continue;
      const rect = container.getBoundingClientRect();
      const style = win.getComputedStyle(container);
      const contentWidth = container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const rows = [];
      for (const child of children) {
        const childRect = child.getBoundingClientRect();
        let row = rows.find(candidate => Math.abs(candidate.top - childRect.top) <= 2);
        if (!row) {
          row = { top: childRect.top, items: [] };
          rows.push(row);
        }
        row.items.push(childRect);
      }
      rows.sort((a, b) => a.top - b.top);
      const metrics = rows.map(row => {
        const left = Math.min(...row.items.map(item => item.left));
        const right = Math.max(...row.items.map(item => item.right));
        return {
          items: row.items.length,
          coverage: Number(Math.min(1, (right - left) / contentWidth).toFixed(4))
        };
      });
      containers.push({
        selector,
        className: typeof container.className === 'string' ? container.className : '',
        width: Math.round(rect.width),
        rowCount: metrics.length,
        rows: metrics
      });
    }
  }

  const panelRows = [];
  for (const content of doc.querySelectorAll('.content')) {
    const panels = [...content.querySelectorAll('.panel')].filter(panel => panel.getBoundingClientRect().width > 0);
    const rows = [];
    for (const panel of panels) {
      const rect = panel.getBoundingClientRect();
      let row = rows.find(candidate => Math.abs(candidate.top - rect.top) <= 2);
      if (!row) {
        row = { top: rect.top, panels: [] };
        rows.push(row);
      }
      row.panels.push({ title: panel.querySelector('.panel-title')?.textContent?.trim() ?? '', height: Number(rect.height.toFixed(2)) });
    }
    for (const row of rows.filter(item => item.panels.length > 1)) {
      const heights = row.panels.map(panel => panel.height);
      panelRows.push({
        panels: row.panels,
        difference: Number((Math.max(...heights) - Math.min(...heights)).toFixed(2))
      });
    }
  }

  const documentWidth = Math.max(doc.documentElement.scrollWidth, doc.body.scrollWidth, doc.querySelector('.page')?.scrollWidth ?? 0);
  const overflowElements = [...doc.querySelectorAll('body *')]
    .map(element => ({ element, rect: element.getBoundingClientRect() }))
    .filter(({ element, rect }) => rect.width > 0 && rect.right > width + 1 && win.getComputedStyle(element).position !== 'fixed')
    .slice(0, 12)
    .map(({ element, rect }) => ({ selector: element.id ? '#' + element.id : element.className, left: Math.round(rect.left), right: Math.round(rect.right), width: Math.round(rect.width) }));
  reportElement.textContent = JSON.stringify({
    viewport: { width, height },
    measuredViewportWidth: doc.documentElement.clientWidth,
    containers,
    panelRows,
    overflow: { documentWidth, viewportWidth: width, horizontal: documentWidth > width + 1, elements: overflowElements }
  });
}

window.addEventListener('load', measure, { once: true });
</script>
</body>
</html>
